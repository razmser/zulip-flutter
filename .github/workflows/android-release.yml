name: Android release

# Builds signed APKs for this fork, and on a tag push publishes them
# as a GitHub release.  To release:
#   git tag v30.0.274-drawbridge.1 && git push fork v30.0.274-drawbridge.1
on:
  push:
    tags: ['v*-drawbridge.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: "Build signed APKs"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 17
        distribution: temurin

    - name: Clone Flutter SDK
      run: tools/ci/clone-flutter-sdk

    - name: Check out the Flutter version pinned in pubspec.yaml
      # Flutter main moves fast; build with the version this release
      # was tested with, rather than whatever is at the tip today.
      run: |
        rev=$(sed -nE "s/^  flutter: .*# ([0-9a-f]{40})\$/\1/p" pubspec.yaml)
        test -n "$rev"
        git -C ~/flutter checkout -q -B main "$rev"
        flutter --version

    - name: Set up release signing
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      run: |
        echo "$KEYSTORE_BASE64" | base64 -d > android/release.keystore
        cat > android/release-keystore.properties <<EOF
        storeFile=release.keystore
        keyAlias=zulip-fork
        storePassword=$KEYSTORE_PASSWORD
        keyPassword=$KEYSTORE_PASSWORD
        EOF

    - name: Build APKs
      run: |
        version=$(sed -nE 's/^version: ([^+]+).*/\1/p' pubspec.yaml)
        mkdir dist
        flutter build apk --release -Psigned
        cp build/app/outputs/flutter-apk/app-release.apk \
          dist/zulip-$version-drawbridge-universal.apk
        flutter build apk --release -Psigned --split-per-abi
        for abi in arm64-v8a armeabi-v7a x86_64; do
          cp build/app/outputs/flutter-apk/app-$abi-release.apk \
            dist/zulip-$version-drawbridge-$abi.apk
        done
        ls -l dist

    - uses: actions/upload-artifact@v4
      with:
        name: apks
        path: dist/*.apk

    - name: Publish GitHub release
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release create "$GITHUB_REF_NAME" dist/*.apk \
          --repo "$GITHUB_REPOSITORY" \
          --title "Zulip $GITHUB_REF_NAME" \
          --notes "Unofficial build of the Zulip Android app with Drawbridge support (Android 14+ for Drawbridge sign-in).

        Most phones want the **arm64-v8a** APK; if unsure, use **universal**.

        Signed with this fork's own key, so it can't install over the official Zulip app; uninstall that first."
